name: Build T1X-Server
description: Build T1X-Server with the provided options.
inputs:
  target:
    description: The target (debug/release).
    default: "debug"
  buildflags:
    default: "-Dcompile_ssl=true -Dcompile_curl=true -Denable_unsafe=true -Dprefix=$(realpath .)"
runs:
  using: "composite"
  steps:
    - name: Setup and Compile
      shell: bash
      env:
          BUILDFLAGS: ${{ inputs.buildflags }}
      run: |
        echo "Building with flags:" ${{ env.BUILDFLAGS }}
        export PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig:/usr/lib32/pkgconfig:$PKG_CONFIG_PATH
        meson setup build/${{ inputs.target }} --buildtype=${{ inputs.target }} ${{ env.BUILDFLAGS }}
        ninja -C build/${{ inputs.target }} install
        ls -l bin/
