name: 📊 Static Checks
on:
  workflow_call:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-static
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static Checks (clang-format, file format)
    runs-on: "ubuntu-24.04"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Azure repositories are flaky, remove them.
          sudo rm -f /etc/apt/sources.list.d/{azure,microsoft}*
          sudo apt-get update
          sudo apt-get install -qq dos2unix moreutils git
          sudo update-alternatives --remove-all clang-format || true
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-16 100

      - name: File format checks (file_format.sh)
        run: |
          bash ./misc/scripts/file_format.sh

      - name: Style checks via clang-format (clang_format.sh)
        run: |
          bash ./misc/scripts/clang_format.sh

      - name: Doc Check
        run: |
          bash ./misc/scripts/doc_check.sh

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Check all markdown and reStructuredText files in repo
          args: --base . --verbose --no-progress './**/*.md' './**/*.html' './**/*.rst'
          # Use different output file path
          output: /tmp/links_check.txt
          # fail action on broken links
          fail: true
